<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} </title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/pico.min.css') }}">
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-gap: 10px;
            justify-items: center;
            align-items: center;
            margin: 20px auto;
            width: 90vw;
            height: 80vh;
        }
        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: var(--gray-300);
            cursor: pointer;
            border-radius: 5px;
            font-size: 24px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .grid-item.selected {
            background-color: #007BFF;
            color: white;
        }
    </style>
    <script>
        async function toggleNumberSelection(element) {
            const number = element.textContent.trim();

            if (element.classList.contains("selected")) {
                const response = await fetch(`/api/number/${number}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    element.classList.remove("selected");
                    console.log("Removed:", number);
                } else {
                    const errorText = await response.text();
                    alert("Error removing " + number + ": " + errorText);
                }
            } else {
                const params = "numbers=" + number;
                const response = await fetch(`/api/number`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: params
                });

                if (response.ok) {
                    element.classList.add("selected");
                    console.log("Added:", number);
                } else {
                    const errorText = await response.text();
                    alert("Error adding " + number + ": " + errorText);
                }
            }
        }

        async function resetSelection() {
            const response = await fetch(`/api/number_all`, {
                method: 'DELETE'
            });

            if (response.ok) {
                document.querySelectorAll(".grid-item.selected").forEach(item => item.classList.remove("selected"));
               // alert("Reseted");
            } else {
                const errorText = await response.text();
                alert("Error: " + errorText);
            }
        }

        async function fetchSelectedNumbers() {
            const response = await fetch('/api/number', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            });

            if (response.ok) {
                const selectedNumbers = await response.json();
                selectedNumbers.forEach(number => {
                    const element = document.querySelector(`.grid-item:nth-child(${number+1})`);
                    if (element) {
                        element.classList.add("selected");
                    }
                });
            } else {
                const errorText = await response.text();
                console.error("Error fetching selected numbers: " + errorText);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchSelectedNumbers);
    </script>
</head>
<body>
    <main>
        <h1 style="text-align: center;">{{ title }}</h1>
        <div class="grid-container">
            <script>
                for (let i = 1; i <= 90; i++) {
                    document.write(`<div class="grid-item" onclick="toggleNumberSelection(this)">${i}</div>`);
                }
            </script>
        </div>
        <div style="text-align: center;">
            <button onclick="resetSelection()">{{ reset_button }}</button>
            <button onclick="location.href ='/number_manual';">{{ change_ui_button }}</button>
        </div>
    </main>
</body>
</html>
